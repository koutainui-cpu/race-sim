name: fetch-june-july
on:
  push:
    paths: ['.github/workflows/junejuly.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: junejuly
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          set +e
          sudo apt-get install -y -q lhasa >/dev/null
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          mkdir -p odds before /tmp/k
          get() { o=$1/$2_$3_$(printf %02d $4).html.gz; [ -s $o ] && return
            curl -s --compressed -m 30 -A "Mozilla/5.0" "https://www.boatrace.jp/owpc/pc/race/$5?rno=$4&jcd=$3&hd=$2" | gzip -n > $o
            [ $(stat -c%s $o) -lt 2000 ] && rm -f $o; sleep 1; }
          export -f get
          for ymd in $(seq -w 260601 260630) $(seq -w 260701 260731); do
            f=data/K/k$ymd.lzh; [ -f $f ] || continue
            rm -rf /tmp/k/*; lha xqw=/tmp/k $f >/dev/null 2>&1
            for j in $(cat /tmp/k/* | grep -ao '^[0-9][0-9]KBGN' | cut -c1-2 | sort -u); do
              for r in $(seq 1 12); do
                echo "odds 20$ymd $j $r odds3t"
                echo "before 20$ymd $j $r beforeinfo"
              done
            done | xargs -P 3 -n 5 bash -c 'get "$0" "$1" "$2" "$3" "$4"'
            echo "20$ymd OK odds $(ls odds | wc -l) before $(ls before | wc -l)"
            git add odds before; git commit -qm "junejuly 20$ymd" && { git pull -q --rebase -X theirs || git rebase --abort; git push -q || echo "push NG"; }
          done
