name: fetch-data
on:
  push:
    paths: ['.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          set +e
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          mkdir -p data/K data/B
          base=""
          for b in http://www1.mbrace.or.jp https://www1.mbrace.or.jp; do
            code=$(curl -s -m 20 -o /tmp/t.lzh -w "%{http_code}" "$b/od2/K/202609/k260901.lzh")
            echo "test $b -> $code"
            if [ "$code" = "200" ]; then base=$b; break; fi
          done
          if [ -z "$base" ]; then echo "NG: 公式サイトに接続できません"; exit 1; fi
          for m in $(seq 0 23); do
            ym=$(date -u -d "2026-09-01 -$m month" +%Y%m)
            for dd in $(seq -w 1 31); do
              date -u -d "${ym:0:4}-${ym:4:2}-$dd" >/dev/null 2>&1 || continue
              ymd=${ym:2:4}$dd
              for t in K B; do
                l=$(echo $t | tr A-Z a-z); f=data/$t/$l$ymd.lzh
                [ -s $f ] || curl -sf -m 20 -o $f "$base/od2/$t/$ym/$l$ymd.lzh" || rm -f $f
                sleep 0.3
              done
            done
            echo "$ym OK  K:$(ls data/K | wc -l) B:$(ls data/B | wc -l)"
            git add data; git commit -qm "data $ym" && git pull -q --rebase && git push -q
          done
